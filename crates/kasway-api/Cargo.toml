[package]
name = "kasway-api"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kasway_api"
path = "src/lib.rs"

[[bin]]
name = "kasway-server"
path = "src/main.rs"

[dependencies]
kasway-db = { path = "../kasway-db" }
kasway-covenant = { path = "../kasway-covenant" }
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
rand.workspace = true
scrypt.workspace = true
ed25519-dalek.workspace = true
url.workspace = true
reqwest.workspace = true
futures.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
reqwest.workspace = true
# Used only by examples (subscription_tn10_smoke) to assemble the plain P2PK
# funding transaction. Same tag kasway-covenant pins, so nothing new is built.
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
