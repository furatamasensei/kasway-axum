# Local development stack: the kasway-api server plus its PostgreSQL database.
#
#   docker compose up --build      # build the image and start the stack
#   docker compose up -d           # start in the background
#   docker compose logs -f api     # follow the server logs
#   docker compose down            # stop; add -v to also drop the DB volume
#
# The server runs its embedded migrations against the `kasway` database on
# startup, so no separate migrate step is needed.

# Log rotation lives HERE, not in the app: the server logs to stdout, and what
# actually grows on disk is Docker's json-file log. Its default is unbounded — a
# chatty API can fill the host's disk and take the database down with it. Capping
# the driver bounds every service at max-size × max-file (30 MB below), and keeps
# `docker compose logs` working exactly as before.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kasway
    ports:
      - "5432:5432"
    volumes:
      - kasway-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kasway"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` is the compose service hostname on the shared network.
      DATABASE_URL: postgres://postgres:postgres@db:5432/kasway
      HOST_PORT: 0.0.0.0:8080
      RUST_LOG: info
      # Everything below is optional; see .env.example for the full list.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"

volumes:
  kasway-db-data:
