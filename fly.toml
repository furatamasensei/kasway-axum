# fly.toml app configuration file generated for kasway-axum on 2026-07-12T19:38:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kasway-axum'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST_PORT = '0.0.0.0:8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
